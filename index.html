<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Video Player & Ads</title>
    
    <!-- 1. ပေးထားသော Data-cfasync Banner Ad Script အသစ် -->
    <script data-cfasync="false" src="https://bauval.org/14/4587f6ec99043b05ff46ce9714215c21"></script>

    <!-- 2. ပေးထားသော Iframe Banner Ad Script အသစ် -->
    <script>
      atOptions = {
        'key' : '3bff7c777e110699213d42c510e72b94',
        'format' : 'iframe',
        'height' : 90,
        'width' : 728,
        'params' : {}
      };
    </script>
    <script src="https://bauval.org/22/3bff7c777e110699213d42c510e72b94"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #0b0f19; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        .app-container { position: relative; width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .video-wrapper { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .ui-overlay { position: absolute; top: 20px; left: 20px; right: 20px; z-index: 5; background: rgba(15, 23, 42, 0.75); padding: 12px 18px; border-radius: 12px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .video-title { font-size: 15px; font-weight: 600; color: #38bdf8; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
        
        .banner-ad-container {
            position: absolute; bottom: 0; width: 100%; display: flex; justify-content: center; background: #0f172a; z-index: 6; padding: 5px 0; border-top: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }

        #ad-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10; text-align: center; padding: 20px;
            backdrop-filter: blur(15px);
        }
        .ad-box { 
            background: linear-gradient(145deg, #1e293b, #0f172a); 
            padding: 35px 25px; border-radius: 20px; width: 90%; max-width: 360px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
        }
        .ad-box h3 { color: #f87171; margin-bottom: 10px; font-size: 20px; font-weight: 700; }
        .ad-box p { color: #94a3b8; font-size: 13px; margin-bottom: 15px; }
        
        .timer-text { font-size: 32px; font-weight: 800; margin: 15px 0; color: #fbbf24; }
        
        .ad-link-btn { 
            display: block; background: linear-gradient(135deg, #0284c7, #0369a1); color: white; padding: 14px; text-decoration: none; border-radius: 12px; margin-top: 15px; font-weight: bold; font-size: 15px;
            box-shadow: 0 6px 0 #075985, 0 10px 20px rgba(0,0,0,0.4);
            cursor: pointer;
        }
        .ad-link-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #075985; }

        #start-video-btn { 
            display: none; background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; margin-top: 15px; 
            box-shadow: 0 6px 0 #15803d, 0 10px 20px rgba(0,0,0,0.4);
        }
        #start-video-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #15803d; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="video-wrapper">
            <video id="main-video" controls playsinline>
                <source id="video-source" src="" type="video/mp4">
            </video>
        </div>

        <div class="ui-overlay">
            <div class="video-title" id="v-title">✨ ဗီဒီယိုအမည် ဖော်ပြမည်...</div>
        </div>

        <div class="banner-ad-container" id="banner-box"></div>

        <div id="ad-modal">
            <div class="ad-box">
                <h3>💎 𝖵𝖨𝖣𝖤𝖮 𝖫𝖮𝖢𝖪𝖤𝖤𝖉</h3>
                <p>ကျေးဇူးပြု၍ အောက်ပါ ကြော်ငြာလင့်ခ်ကို နှိပ်၍ အချိန် ၂၀ စက္ကန့် စောင့်ပါ</p>
                
                <div class="timer-text"><span id="countdown">20</span> စက္ကန့်</div>

                <!-- ပေးထားသော Direct Link အသစ် -->
                <a onclick="openDirectAd()" class="ad-link-btn">✨ ကြော်ငြာလင့်ခ်သို့ သွားရန် 🚀</a>

                <button id="start-video-btn" onclick="startWatchingVideo()">▶️ ဗီဒီယို စတင်ကြည့်မည် 🎬</button>
            </div>
        </div>
    </div>

    <script>
        // 🔗 ပေးထားသော Direct Link အသစ် အစစ်အမှန်
        const directAdUrl = "https://araplhn.org/4/5485f210cd45bf028dd9289dd52f5a19";

        function openDirectAd() {
            window.open(directAdUrl, '_blank');
        }

        const urlParams = new URLSearchParams(window.location.search);
        const videoTitleParam = urlParams.get('title');
        const videoTitle = videoTitleParam ? decodeURIComponent(videoTitleParam) : "ဗီဒီယိုအသစ်";
        document.getElementById('v-title').textContent = "📌 " + videoTitle;

        const videoUrl = "https://www.w3schools.com/html/mov_bbb.mp4";

        const videoElement = document.getElementById('main-video');
        const videoSource = document.getElementById('video-source');
        const adModal = document.getElementById('ad-modal');
        const countdownEl = document.getElementById('countdown');
        const startBtn = document.getElementById('start-video-btn');

        triggerPreVideoAd();

        function triggerPreVideoAd() {
            adModal.style.display = 'flex';
            let timeLeft = 20;
            countdownEl.textContent = timeLeft;
            startBtn.style.display = 'none';

            let timer = setInterval(() => {
                timeLeft--;
                countdownEl.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    startBtn.style.display = 'block';
                }
            }, 1000);
        }

        function startWatchingVideo() {
            adModal.style.display = 'none';
            videoSource.src = videoUrl;
            videoElement.load();
            videoElement.play();
        }
    </script>
</body>
</html>
